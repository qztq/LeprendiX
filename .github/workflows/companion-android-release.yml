name: Build and release Companion APK

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Stage public Companion app files
        run: python scripts/stage_companion_web.py

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx cap add android

      - name: Copy Companion web assets
        run: npx cap sync android

      - name: Configure installable Companion APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME="${RELEASE_TAG#companion-v}"
          npm run android:prepare -- --version-code "$RUN_NUMBER" --version-name "$VERSION_NAME"

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is required to sign the Companion APK."
              exit 1
            fi
          done

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/companion-release.jks"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign release APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_NAME="LeprendiX-Companion-${RELEASE_TAG}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/companion-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK_NAME" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK_NAME"

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "LeprendiX-Companion-${RELEASE_TAG}.apk" \
            --title "LeprendiX Companion ${RELEASE_TAG#companion-v}" \
            --generate-notes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeprendiX-Companion-${{ github.ref_name }}
          path: LeprendiX-Companion-${{ github.ref_name }}.apk
          if-no-files-found: error
