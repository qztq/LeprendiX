[tool.poetry]
name = "LeprendiX"
version = "1.0.0"
description = "Mobile companion app for LeprendiX"
authors = ["Tobias"]

[tool.poetry.dependencies]
python = "^3.8"
flet = "^0.80.2"
pyzbar = "^0.1.9"
Pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flet]
app-name = "LeprendiX Mobile"
permissions = [
    "INTERNET",
    "CAMERA",
    "READ_EXTERNAL_STORAGE",
    "WRITE_EXTERNAL_STORAGE"
]